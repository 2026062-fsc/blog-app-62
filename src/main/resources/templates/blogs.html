<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/blogstyle.css">
    <title>All Blogs</title>
</head>

<body>
    <header class="site-header">
        <div class="header-logo">
            <h1>Spring Blogs</h1>
        </div>
        <nav class="header-nav">
            <ul>
                <li><a href="/">HOME</a></li>
                <li><a href="/">BLOG LIST</a></li>
                <li><a href="/">ADD BLOG</a></li>
            </ul>
        </nav>
    </header>
    <div class="bloglist" th:if="${!#lists.isEmpty(blogList)}">
        <ul>
            <li th:each="blog : ${blogList}" class="blog list">
                <h3 th:text="${blog.title}">タイトル</h3>
                <p th:text="${#strings.abbreviate(blog.body, 30)}">本文</p>
            </li>
        </ul>
    </div>
    <div class="empty-message" th:if="${#lists.isEmpty(blogList)}">
        投稿はありません
    </div>




</body>

</html>
